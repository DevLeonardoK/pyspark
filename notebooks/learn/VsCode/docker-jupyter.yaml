services:
  jupyter:
    image: jupyter/pyspark-notebook
    user: root
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - NB_USER=jovyan
      - NB_UID=1000
      - NB_GID=100
      - CHOWN_HOME=yes
      - CHOWN_EXTRA=/home/jovyan/work,/home/jovyan/data
      - CHOWN_EXTRA_OPTS=-R
      - GRANT_SUDO=yes
